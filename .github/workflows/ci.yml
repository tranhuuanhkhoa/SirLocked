name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Restore backend
        run: dotnet restore SirLocked.sln
      - name: Test backend
        run: dotnet test SirLocked.sln --configuration Release --no-restore
      - name: Install frontend dependencies
        working-directory: src/FE
        run: npm ci
      - name: Typecheck frontend
        working-directory: src/FE
        run: npm run typecheck
      - name: Test case asset packaging
        working-directory: src/FE
        run: npm run test:assets
      - name: Test bounded retries and connection recovery
        working-directory: src/FE
        run: npm run test:realtime
      - name: Test contextual role guide progress
        working-directory: src/FE
        run: npm run test:guide
      - name: Install browser for UI tests
        working-directory: src/FE
        run: npx playwright install --with-deps chromium
      - name: Test presentation and paired gameplay UI
        working-directory: src/FE
        run: npm run test:ui
      - name: Build frontend
        working-directory: src/FE
        run: npm run build
      - name: Build the bundled V3 demo release
        working-directory: src/FE
        run: npm run build:demo
      - name: Upload demo frontend and asset manifest
        uses: actions/upload-artifact@v4
        with:
          name: sirlocked-v3-demo-frontend
          path: src/FE/dist

  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ci-only-secret-with-at-least-32-characters
      MongoDb__ConnectionString: mongodb://127.0.0.1:27017
      MongoDb__DatabaseName: SirLockedCi
      MOCK_AI_RESPONSES: 'true'
      SKIP_ASSET_GENERATION: 'true'
      # Room creation requires a verified email. The smoke test only speaks the public API and has no
      # inbox, so registrations are auto-verified here. AuthSettings ignores this outside Development.
      Auth__AutoVerifyRegistrations: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build API
        run: dotnet build src/BE/SirLocked.Api.csproj --configuration Release
      - name: Run Mongo concurrency and queue integration tests
        env:
          SIRLOCKED_RUN_MONGO_IT: 'true'
          SIRLOCKED_TEST_MONGO_CONNECTION_STRING: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=3000
        run: dotnet test src/BE/IntegrationTests/SirLocked.IntegrationTests.csproj --configuration Release
      - name: Start API
        run: |
          dotnet run --project src/BE/SirLocked.Api.csproj --configuration Release --no-build --urls http://127.0.0.1:5215 > api.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5215/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1
      - name: Run API gameplay smoke test
        run: python scripts/e2e_smoke.py --base http://127.0.0.1:5215
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log

  two-browser-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/FE/package-lock.json
      - name: Restore API and disposable-database seeder
        run: dotnet restore tools/FullStackTestSeeder/FullStackTestSeeder.csproj
      - name: Install frontend and browser
        working-directory: src/FE
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Play V3 through real HTTP, MongoDB and two browsers
        shell: pwsh
        run: ./scripts/test-v3-full-stack.ps1 -ApiPort 5315 -FrontendPort 5273
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: two-browser-failure-traces
          path: src/FE/test-results
