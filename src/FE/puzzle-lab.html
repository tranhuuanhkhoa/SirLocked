<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Lab — Sir Locked (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/_tokens.css">
<link rel="stylesheet" href="/css/00-base.css">
<style>
  body { margin: 0; min-height: 100vh; background: #0b0806; color: #e2d8c6; font-family: 'Crimson Text', Georgia, serif; }
  .lab-bar { position: fixed; z-index: 100; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 10px; background: rgba(13,16,20,.94); box-shadow: inset 0 0 0 1px rgba(239,212,134,.35); font: 12px 'Source Code Pro', monospace; }
  .lab-bar select, .lab-bar input, .lab-bar button { font: inherit; }
  .lab-debug { position: fixed; z-index: 100; right: 12px; bottom: 12px; max-width: 420px; max-height: 40vh; overflow: auto; padding: 8px;
    background: rgba(13,16,20,.94); box-shadow: inset 0 0 0 1px rgba(239,212,134,.35); font: 11px 'Source Code Pro', monospace; white-space: pre-wrap; }
  .lab-debug[hidden] { display: none; }
</style>
</head>
<body>
<div id="lab-puzzle-slot"></div>
<div class="lab-bar" role="toolbar" aria-label="Puzzle lab">
  <label>Kind <select id="lab-kind"></select></label>
  <label>Độ khó <select id="lab-diff"><option>EASY</option><option>NORMAL</option><option>HARD</option></select></label>
  <label>Seed <input id="lab-seed" type="number" value="1" style="width:70px"></label>
  <button id="lab-new" type="button">Tạo mới</button>
  <button id="lab-open" type="button">Mở lại</button>
  <label><input id="lab-solved" type="checkbox"> Đã giải (đối tác)</label>
  <button id="lab-debug-btn" type="button">JSON</button>
</div>
<pre class="lab-debug" id="lab-debug" hidden></pre>
<script type="module" src="/Client/js/game/puzzles/lab.ts"></script>
</body>
</html>
