services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/BE/Dockerfile
    restart: unless-stopped
    env_file:
      - ${SIRLOCKED_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: ${MONGODB_DATABASE:-sirlocked}
      DataProtection__KeysPath: /app/keys
    volumes:
      - api-keys:/app/keys
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/live"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: src/FE/Dockerfile
    restart: unless-stopped
    ports:
      - "${SIRLOCKED_WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  api-keys:
